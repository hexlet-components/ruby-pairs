# Дефолт rubocop: правила руками не выбираются и руками не правятся.
plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  Exclude:
    - "**/vendor/**/*"
    - "**/node_modules/**/*"
    - "**/tmp/**/*"

# Отступления от дефолта. Каждое с причиной: без причины правило не отключается.

# Учебные примеры показывают механику целиком, а дефолт требует одну проверку
# на пример и не длиннее пяти строк. Дробление спрятало бы то, что показывают.
RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false
